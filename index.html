<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>記念祭２０２６特別企画『フォトハント』</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
</head>

<body>
    <header></header>

    <section id="start-screen" class="hidden screen">
        <p>第78回記念祭　特別企画</p>
        <h2>～撮って！巡って！～</h2>
        <h1>記念祭フォトハント</h1>
        <img src="kinennsailogo.jpg" alt="記念祭ロゴ">
        <p>１．お題を探す<br>
            ２．写真を撮る<br>
            ３．カードを印刷
        </p>
        <button id="start-button">はじめから</button>
        <button id="continue-button" class="hidden">続きから</button>
        <button id="view-complete-button" class="hidden">カードを見る</button>
    </section>

    <section id="card-screen" class="hidden screen">
        <h1>あなたのカード</h1>
        <div id="bingo-grid"></div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
        <button id="change-button">お題チェンジ</button>
        <button id="go-complete-button" class="hidden">完成カードを見る</button>
        
    </section>

    <section id="complete-screen" class="hidden screen">
        <h2>全マスクリア</h2>
        <h1>おめでとう！！</h1>
        <div class="image-frame">
            <img id="final-card-img" alt="完成したカード">
        </div>

        <div class="button-row">
            <button id="yoko-button">横</button>
            <button id="tate-button">縦</button>
        </div>

        <button id="save-button">画像を保存する</button>
        <button id="home-button">ホームに戻る</button>
    </section>
    
    <script src="script.js"></script>

    <footer> </footer>

    
</body>

</html>
